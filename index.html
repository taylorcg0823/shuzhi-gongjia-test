/* 登录头部：图标/标题/扫描线/版本号 垂直居中对齐 */

.login-aurora{position:fixed;top:0;left:0;width:100%;height:100px;overflow:hidden;pointer-events:none;z-index:2;-webkit-mask-image:linear-gradient(180deg,black 40%,transparent 100%);mask-image:linear-gradient(180deg,black 40%,transparent 100%)}
.login-aurora .au{position:absolute;left:-10%;top:-20%;width:120%;height:150%;background:linear-gradient(100deg,#0d1f38 0%,#1a4d7d 10%,#3a2a75 22%,#17508a 32%,#0e5a6e 42%,#0d1f38 50%,#1a4d7d 60%,#3a2a75 72%,#17508a 82%,#0e5a6e 92%,#0d1f38 100%);background-size:400% 100%;filter:blur(9px);animation:auroraFlow 24s linear infinite}
@keyframes auroraFlow{0%{background-position:0% 0%}100%{background-position:100% 0%}}
.login-title{position:relative;font-family:'Noto Sans SC','HarmonyOS Sans SC',PingFang SC,sans-serif;font-weight:900;font-size:38px;letter-spacing:6px;text-align:center;background:linear-gradient(100deg,#00e5ff 0%,#2d7aff 45%,#a855f7 75%,#00e5ff 100%);background-size:250% 100%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:shimmer 4s ease-in-out infinite,titleGlow 3s ease-in-out infinite;filter:drop-shadow(0 0 12px rgba(45,114,255,.45)) drop-shadow(0 0 30px rgba(168,85,247,.25));margin-top:6px}

<script>
/* ============================================================================
 * 数智工价 V2.4.0 — 工价计算器
 * 稳定性优化版（功能与数据格式与原版完全兼容）
 * 主要改进：修复 AI 回复空白 / NaN 显示 / 重复 DOM id / 双重初始化 等问题；

 * ============================================================================ */

/* ----------------------------------------------------------------------------
 * 一、数据常量（材料库 / 工艺库）
 * -------------------------------------------------------------------------- */
const MATS=[{n:'碳素结构钢',i:[{n:'Q235 (A3钢)',de:7.85},{n:'45#钢',de:7.85},{n:'40Cr',de:7.85},{n:'65Mn',de:7.85}]},{n:'合金钢',i:[{n:'Cr12 (模具钢)',de:7.85},{n:'Cr12MoV',de:7.85},{n:'SKD11',de:7.85},{n:'DC53',de:7.85},{n:'H13',de:7.85}]},{n:'不锈钢',i:[{n:'304',de:7.93},{n:'316',de:7.98},{n:'410',de:7.75},{n:'420',de:7.75},{n:'430',de:7.70}]},{n:'铝合金',i:[{n:'6061',de:2.70},{n:'6063',de:2.69},{n:'7075',de:2.81},{n:'5052',de:2.68},{n:'LY12',de:2.78}]},{n:'铜合金',i:[{n:'黄铜 H62',de:8.43},{n:'黄铜 H65',de:8.47},{n:'紫铜 T2',de:8.96},{n:'青铜 QSn6.5',de:8.80},{n:'铍铜 QBe2',de:8.23}]},{n:'钛合金',i:[{n:'TC4',de:4.43},{n:'TA2',de:4.51}]},{n:'工程塑料',i:[{n:'尼龙 PA6',de:1.14},{n:'PA66',de:1.15},{n:'POM',de:1.41},{n:'ABS',de:1.05},{n:'PTFE',de:2.20},{n:'PC',de:1.20}]},{n:'其他',i:[{n:'铸钢',de:7.80},{n:'灰铸铁',de:7.20},{n:'球墨铸铁',de:7.30}]}];
const PROCS=[{n:'加工中心',i:[{n:'三轴 (≤300mm)',p:60},{n:'三轴 (1~2m)',p:80},{n:'三轴 (>2m)',p:100},{n:'四轴',p:120},{n:'五轴',p:200},{n:'卧式加工中心',p:150}]},{n:'数控车床',i:[{n:'排刀式数控车',p:50},{n:'刀塔式数控车',p:60},{n:'车铣复合',p:80}]},{n:'普通机床',i:[{n:'手摇车床',p:40},{n:'普通车床',p:45},{n:'手摇钻床',p:35},{n:'摇臂钻',p:40},{n:'镗床',p:60},{n:'坐标镗',p:80},{n:'牛头刨',p:50}]},{n:'磨床',i:[{n:'精密平面磨',p:200},{n:'大水磨',p:80},{n:'外圆磨',p:60},{n:'内圆磨',p:60}]},{n:'特种加工',i:[{n:'线切割',p:0.005},{n:'电火花',p:50},{n:'激光切割',p:35}]},{n:'表面处理',i:[{n:'镀铬',p:19},{n:'镀锌',p:3},{n:'阳极氧化 (本色)',p:4},{n:'阳极氧化 (喷砂)',p:8},{n:'镀镍',p:5},{n:'喷漆',p:5}]},{n:'热处理',i:[{n:'淬火',p:5},{n:'回火',p:3},{n:'氮化',p:8},{n:'真空加硬',p:10}]},{n:'钣金/冲压',i:[{n:'冲压',p:2},{n:'折弯',p:3},{n:'剪板',p:2},{n:'焊接',p:20}]},{n:'钻孔/攻牙',i:[{n:'钻孔',p:0.5},{n:'攻牙',p:0.5}]}];
let S={lg:false,cu:null,tab:'calc',a:'',b:'',date:'',no:'',shp:'square',l:'',w:'',h:'',d:'',h2:'',mt:null,mp:'',q:1,pr:[],dl:'self',df:'',tx:'no',fe:[],co:{name:'',phone:'',addr:'',logo:''},pi:{realName:'',phone:'',email:'',position:''},prRate:0,mPrices:{},batchMode:false,items:[]};

/* 登录页气泡背景动画 */
var bc=null,bxCtx=null,bW=0,bH=0,bubbles=[],bubbleAnimId=null;
var STAR_COLORS=['#00e5ff','#2d7aff','#a855f7','#7dd3fc','#8b5cf6'];
function initBubbles(){ bc=document.getElementById('bubbleCanvas'); if(!bc) return;
/* 幂等：若粒子已在运行，不再重建/重复启动，避免叠加多个动画循环导致加速 */
if(bubbleAnimId) return;
bxCtx=bc.getContext('2d');
function rs(){ bW=bc.width=window.innerWidth; bH=bc.height=window.innerHeight; }
rs(); window.addEventListener('resize',rs);
bubbles=[]; for(var i=0;i<120;i++){ bubbles.push({ x:Math.random()*bW, y:Math.random()*bH, r:.5+Math.random()*2.4, s:.25+Math.random()*.55, vy:-(.05+Math.random()*.22), baseX:Math.random()*bW, amp:10+Math.random()*35, ph:Math.random()*Math.PI*2, freq:.3+Math.random()*.7, c:STAR_COLORS[Math.floor(Math.random()*STAR_COLORS.length)] }); }
startBubbles();
}
function startBubbles(){ if(!bxCtx) return;
function dr(){ bxCtx.clearRect(0,0,bW,bH);
  bubbles.forEach(function(p){ p.y+=p.vy; p.ph+=p.freq*.016; /* 曲线：水平正弦摆动 */
    p.x=p.baseX+Math.sin(p.ph)*p.amp;
    /* 粒子碰到顶部极光区域（约230px高）→ 被极光吸收，重置到下方重新出现 */
    if(p.y<235){ p.y=bH+Math.random()*120; p.baseX=Math.random()*bW; p.x=p.baseX; }
    /* 不闪烁：透明度恒定 */
    bxCtx.globalAlpha=p.s; bxCtx.beginPath(); bxCtx.arc(p.x,p.y,p.r,0,Math.PI*2); bxCtx.fillStyle=p.c; bxCtx.fill();
  });
  bxCtx.globalAlpha=1; bubbleAnimId=requestAnimationFrame(dr);
}
bubbleAnimId=requestAnimationFrame(dr);
}
function stopBubbles(){ if(bubbleAnimId){ cancelAnimationFrame(bubbleAnimId); bubbleAnimId=null; }
if(bxCtx){ bxCtx.clearRect(0,0,bW,bH); bxCtx=null; } }

/* ----------------------------------------------------------------------------
 * 二、稳定性防护工具（新增）
 * -------------------------------------------------------------------------- */

/* 全局错误捕获：任何未捕获异常都不再导致白屏/静默失败，并给出友好提示 */
window.addEventListener('error',function(e){
  if(!e || !e.message) return;
  try{
    var el=document.getElementById('app');
    if(el && !el.innerHTML){ el.innerHTML='<div style="padding:20px;text-align:center;color:#c0392b;font-size:14px">页面出现异常：'+String(e.message).replace(/</g,'&lt;')+'</div>'; }
  }catch(_){}
});
window.addEventListener('unhandledrejection',function(e){
  try{ console.warn('[unhandledrejection]', e && e.reason); }catch(_){}
});

/* localStorage 安全读写：隐私模式 / 存储满 / 被禁用时静默降级，不抛异常 */
function lsGet(k){ try{ return window.localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ window.localStorage.setItem(k,v); }catch(e){ /* 忽略：无痕/禁用时降级 */ } }
function lsDel(k){ try{ window.localStorage.removeItem(k); }catch(e){ /* 忽略 */ } }
function lsGetJSON(k,d){ try{ var v=lsGet(k); return v?JSON.parse(v):d; }catch(e){ return d; } }
function lsSetJSON(k,v){ try{ lsSet(k,JSON.stringify(v)); }catch(e){ /* 忽略 */ } }

/* HTML 转义：所有注入 innerHTML 的用户输入必须先过此函数，防止 XSS */
function es(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

/* 轻量 HTML 消毒：AI 回复等富文本写入 innerHTML 前，剔除脚本与事件属性，防注入 */
function sanHTML(s){ return String(s||'').replace(/<\s*script[\s\S]*?<\s*\/\s*script\s*>/gi,'').replace(/\son[a-z]+\s*=\s*"[^"]*"/gi,'').replace(/\son[a-z]+\s*=\s*'[^']*'/gi,'').replace(/\son[a-z]+\s*=\s*[^\s>]+/gi,''); }

/* 构建 AI 回复关键词高亮词库（材料名 + 工艺名），按长度降序，避免短词先命中吞掉长词 */
var AI_HL_WORDS = (function(){
  var set = {};
  (MATS || []).forEach(function(g){ if(g && g.n) set[g.n] = 1; (g.i||[]).forEach(function(it){ if(it && it.n) set[it.n] = 1; }); });
  (PROCS || []).forEach(function(g){ if(g && g.n) set[g.n] = 1; (g.i||[]).forEach(function(p){ if(p && p.n) set[p.n] = 1; }); });
  var arr = Object.keys(set);
  arr.sort(function(a,b){ return b.length - a.length; });
  return arr;
})();

/* 用蓝色 span 高亮 AI 回复里的关键词：材料名/工艺名/金额/甲方乙方/编号。
   必须在加粗、HTML 转义之前调用，且自身要避免重复包裹已高亮的词。 */
function hlAI(s){
  s = String(s == null ? '' : s);
  if(!s) return s;
  /* 1) 金额：¥ 后跟数字；或 数字 + 元/元/kg/元/小时 */
  s = s.replace(/(¥\s*\d[\d.,]*)/g, '<span class="hl-blue">$1</span>');
  s = s.replace(/(\d[\d.,]*\s*(?:元\/kg|元\/千克|元\/小时|元))/g, '<span class="hl-blue">$1</span>');
  /* 2) 甲方 / 乙方 */
  s = s.replace(/(甲方|乙方)/g, '<span class="hl-blue">$1</span>');
  /* 3) 编号 / 订单号（后跟任意非换行字符，含具体编号值） */
  s = s.replace(/(编号|订单号|订单编号)\s*[:：]?([^\s\n，。；、]*)/g, function(m0, k, v){
    return '<span class="hl-blue">' + k + '</span>' + (v ? '<span class="hl-blue">' + v + '</span>' : '');
  });
  /* 4) 材料 / 工艺词库（按长度降序；跳过已被 <span> 包裹的命中） */
  AI_HL_WORDS.forEach(function(w){
    if(!w) return;
    var rx = new RegExp('((?:<[^>]+>)*)' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'g');
    s = s.replace(rx, function(m0, prefix){
      /* 若该词前面紧跟 span 结尾，说明已高亮，跳过避免嵌套 */
      if(/<\/span>\s*$/.test(prefix) || /<span class="hl-blue">\s*$/.test(prefix)) return m0;
      return prefix + '<span class="hl-blue">' + w + '</span>';
    });
  });
  return s;
}

/* 清理 AI 回复中的乱码替换符（�� / U+FFFD），多字节 emoji 偶发解码失败时的兜底 */
function cleanAI(s){ return String(s == null ? '' : s).replace(/�/g, ''); }

/* 图片压缩：把选中的图片压缩到指定最大边长，返回 base64（大幅减小体积，防分享码超限）。
   读入 File → 画到 canvas 等比缩小 → toDataURL('image/jpeg',0.85) */
function compressImage(file, maxSide, cb){
  try{
    if(!file || typeof file !== 'object' || !file.type || file.type.indexOf('image/') !== 0){ cb(file ? '' : '', false); return; }
    var reader = new FileReader();
    reader.onload = function(ev){
      var img = new Image();
      img.onload = function(){
        try{
          var w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
          if(!w || !h){ cb(ev.target.result, false); return; }
          var scale = Math.min(1, maxSide / Math.max(w, h));
          var nw = Math.round(w * scale), nh = Math.round(h * scale);
          var canvas = document.createElement('canvas');
          canvas.width = nw; canvas.height = nh;
          var ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, nw, nh);
          var out = canvas.toDataURL('image/jpeg', 0.85);
          /* 若压缩后仍比原图大（如小图png），则用原图 */
          if(out.length > ev.target.result.length) out = ev.target.result;
          cb(out, true);
        }catch(e){ cb(ev.target.result, false); }
      };
      img.onerror = function(){ cb(ev.target.result, false); };
      img.src = ev.target.result;
    };
    reader.onerror = function(){ cb('', false); };
    reader.readAsDataURL(file);
  }catch(e){ cb('', false); }
}

/* 数值安全格式化：非法/NaN/Infinity 一律回退为 0，杜绝 "NaN"/"Infinity" 显示 */
function nf(n){ n=parseFloat(n); return isFinite(n)?n:0; }

/* 输入回填辅助（供 initC / initCBatch 共用；原版仅在 initC 局部定义导致批量模式报错） */
function ri(id,val){ const e=document.getElementById(id); if(e&&val!==undefined&&val!==null&&val!=='') e.value=val; }

/* 业务键统一加前缀，与旧数据隔离（旧数据不迁移，见下） */
function keyU(){ return 'u'; }

function keyP(){ return 'p'; }

function keyAU(){ return 'au'; }
function keyAIMsgs(){ var u=(S&&S.cu&&S.cu.uid)||'guest'; return 'aiMsgs_'+u; }

/* ===== 批量模式：每零件一个完整块（材料+工序） ===== */
if(S.batchMode && S.items && S.items.length>0){
  var b='';
  /* 计算各零件材料费/工序费 */
  function bItemWeight(it){

    if(it.shp==='square') v=(parseFloat(it.l)||0)*(parseFloat(it.w)||0)*(parseFloat(it.h)||0);
    else v=Math.PI*((parseFloat(it.d)||0)/2)*(parseFloat(it.d)||0)/2*(parseFloat(it.h2)||0);
    return (v/1000)*it.mt.de/1000;
  }
  function bItemMatCost(it){ return bItemWeight(it)*(parseFloat(it.mp)||0)*(parseInt(it.q)||1); }
  function bProcAmt(p){ var h=parseFloat(p.h)||0; if(p.u==='秒')h/=3600; else if(p.u==='分')h/=60; return h*(parseFloat(p.p)||0); }
  function bItemProcCost(it){ return (it.pr||[]).reduce(function(s,p){return s+bProcAmt(p);},0)*(parseInt(it.q)||1); }

function doShareExport(cb){ try{
  var full={exportVersion:'2.3.1',exportTime:new Date().toISOString(),users:lu(),orders:lo(),company:lp(),personal:pp()};
  var code=''; for(var i=0;i<6;i++){ var c='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'; code+=c[Math.floor(Math.random()*c.length)]; }
  /* 递归清除数据里所有 logo 字段与任何 data:image 大字段，并瘦身订单冗余字段 */
  var stripLogos=function(obj){
    try{
      var s=JSON.parse(JSON.stringify(obj));
      var walk=function(x){
        if(!x||typeof x!=='object') return x;
        if(Array.isArray(x)){ x.forEach(walk); return x; }
        for(var k in x){
          if(k==='logo') x[k]='';
          else if(typeof x[k]==='string' && x[k].indexOf('data:image')===0) x[k]='';
          else if(k==='companyInfo'||k==='personalInfo'){ delete x[k]; }
          else if(x[k]&&typeof x[k]==='object') walk(x[k]);
        }
        return x;
      };
      return walk(s);
    }catch(e){ return obj; }
  };
  var attempt=function(data, label){
    var sizeKB=JSON.stringify(data).length/1024;
    if(label==='full') tstPersist('正在保存账号数据中');   /* 首次点击开始持续提示 */
    cloudSetShare(code,data).then(function(r){

          attempt(slim,'noLogo');

          tstStop(); tst('云端上传失败（'+sizeKB.toFixed(1)+'KB）'+reason,'warn'); if(cb) cb(null);
        }
      }
    }).catch(function(err){ tstStop(); tst('网络错误'+((err&&err.message)?':'+err.message.slice(0,40):''),'warn'); if(cb) cb(null); });
  };
  attempt(full,'full');
}catch(e){ tstStop(); tst('生成失败:'+e.message,'warn'); if(cb) cb(null); }
}

var A_KB = null;

function aBuildKB() {
	var kb = [];
	(MATS || []).forEach(function (g) {
		(g.i || []).forEach(function (it) {
			kb.push({
				id: 'm:' + it.n,
				t: it.n,
				g: '材料',
				k: it.n + ' ' + g.n + ' 材料 密度 单价 用途',
				b: '材料【' + it.n + '】属' + g.n + '，密度 ' + it.de + ' g/cm³。材料费 = 体积(cm³)×' + it.de + '÷1000×单价(元/kg)×数量。密度越高同尺寸月重，报价里材料占比越大。'
			});
		});
	});
	(PROCS || []).forEach(function (g) {
		(g.i || []).forEach(function (p) {
			var fee;
			if (p.n === '线切割') fee = '参考 0.005 元/mm²（按切割面积计）';
			else fee = '参考工时单价 ¥' + p.p + '/小时';
			kb.push({
				id: 'p:' + p.n,
				t: p.n,
				g: '工艺',
				k: p.n + ' ' + g.n + ' 工艺 单价 工时 收费',
				b: '工艺【' + p.n + '】属' + g.n + '，' + fee + '。工序费 = 工时(小时)×单价×数量，工时可用 时/分/秒 录入。'
			});
		});
	});
	return kb.concat(A_KB_EXTRA);
}

/* 中英混合切词：CJK 取 2-gram（≤4 字时补全词），英文/数字/代号按词取 */
function aTok(s) {
	s = String(s || '').toLowerCase();
	var out = [];
	var i;
	var alnum = s.match(/[a-z0-9#+.]{2,}/g) || [];
	for (i = 0; i < alnum.length; i++) out.push(alnum[i]);
	var cjk = s.match(/[\u4e00-\u9fa5]+/g) || [];
	for (i = 0; i < cjk.length; i++) {
		var run = cjk[i];
		if (run.length === 1) { out.push(run); continue; }
		for (var j = 0; j < run.length - 1; j++) out.push(run.substr(j, 2));
		if (run.length <= 4) out.push(run);
	}
	return out;
}

/* ----------------------------------------------------------------------------
 * 14.3 [纯逻辑] 检索器：IDF 加权词频打分（BM25 简化版），标题命中额外加权
 * -------------------------------------------------------------------------- */
function aRetrieve(q, topN) {
	if (!A_KB) A_KB = aBuildKB();
	var N = A_KB.length;
	var qt = aTok(q);
	if (!qt.length) return [];
	var qset = {};
	qt.forEach(function (t) { qset[t] = 1; });

	var df = {};
	var docs = A_KB.map(function (d) {
		var toks = aTok(d.t + ' ' + d.k + ' ' + d.b);
		var tf = {};
		toks.forEach(function (x) { tf[x] = (tf[x] || 0) + 1; });
		Object.keys(tf).forEach(function (x) { df[x] = (df[x] || 0) + 1; });
		return { d: d, tf: tf };
	});

	var scored = [];
	docs.forEach(function (o) {
		var s = 0;
		Object.keys(qset).forEach(function (t) {
			var f = o.tf[t];
			if (!f) return;
			var idf = Math.log((N + 1) / ((df[t] || 1) + 0.5));
			if (idf < 0.05) idf = 0.05;
			s += (f / (f + 1.5)) * idf;
		});
		if (s <= 0) return;
		if (q.indexOf(o.d.t) >= 0) s += 2.5;                 /* 标题整体命中 */
		if (o.d.g === '工艺' && s > 0) s += 0.15;            /* 工艺条目轻微优先（报价场景更常用） */
		scored.push({ s: s, d: o.d });
	});
	scored.sort(function (a, b) { return b.s - a.s; });
	return scored.slice(0, topN || 3).map(function (x) { return x.d; });
}

function aRagBlock(hits) {
	if (!hits || !hits.length) return '';
	var lines = hits.map(function (h, i) { return (i + 1) + ') 【' + h.t + '】' + h.b; });
	return '\n\n【检索到的知识（本机知识库 Top' + hits.length + '，请优先依据这些资料回答）】\n' +
		lines.join('\n') + '\n资料不足以回答时直接说不确定，不要编造。';
}

/* ----------------------------------------------------------------------------
 * 14.7 [纯逻辑] 请求层：小程序侧把 fetch 换成 wx.request 即可；SSE 为预留通道
 * -------------------------------------------------------------------------- */
function aReadSSE(resp, onDelta, onDone, onFail) {
	var reader = resp.body.getReader();
	var dec = new TextDecoder('utf-8');
	var buf = '';
	var full = '';
	function pump() {
		return reader.read().then(function (rs) {
			if (rs.done) { onDone(full, true); return; }
			buf += dec.decode(rs.value, { stream: true });
			var parts = buf.split('\n');
			buf = parts.pop();
			for (var i = 0; i < parts.length; i++) {
				var line = parts[i].replace(/\r$/, '').trim();
				if (line.indexOf('data:') !== 0) continue;
				var payload = line.slice(5).trim();
				if (!payload || payload === '[DONE]') continue;
				var j = null;
				try { j = JSON.parse(payload); } catch (e) { continue; }
				var d = j && j.choices && j.choices[0] && j.choices[0].delta;
				if (d && d.content) { full += d.content; onDelta(full); }
			}
			return pump();
		});
	}
	return pump().catch(function () {
		if (full) onDone(full, true); else onFail('流式读取失败');
	});
}

function aChat(body, onDelta, onDone, onFail) {
	var ab = (typeof AbortController !== 'undefined') ? new AbortController() : null;
	var to = setTimeout(function () { if (ab) { try { ab.abort(); } catch (e) {} } }, 45000);
	var payload = {};
	for (var k in body) { if (Object.prototype.hasOwnProperty.call(body, k)) payload[k] = body[k]; }
	payload.stream = true;
	var opts = { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) };
	if (ab) opts.signal = ab.signal;

	fetch(AI_WORKER_URL, opts).then(function (r) {
		var ct = String(r.headers.get('content-type') || '').toLowerCase();
		if (ct.indexOf('event-stream') >= 0 && r.body && r.body.getReader) {
			return aReadSSE(r, onDelta, function (full) { clearTimeout(to); onDone(full, true); }, function (m) { clearTimeout(to); onFail(m); });
		}
		return r.text().then(function (txt) {
			clearTimeout(to);
			var d = null;
			try { d = JSON.parse(txt); } catch (e) { onFail('响应解析失败（HTTP ' + r.status + '）'); return; }
			if (d && d.error) { onFail(typeof d.error === 'string' ? d.error : JSON.stringify(d.error)); return; }
			var c = d && d.choices && d.choices[0] && d.choices[0].message && d.choices[0].message.content;
			if (c === null || c === undefined || c === '') { onFail('模型没有返回内容'); return; }
			onDone(String(c), false);
		});
	}).catch(function (e) {
		clearTimeout(to);
		if (e && e.name === 'AbortError') onFail('请求超时（45 秒）');
		else onFail('网络异常：' + ((e && e.message) ? e.message : '连接失败'));
	});
}

function aShowReply(el, text, q, meta) {
	/* 清掉流式占位气泡：只移除它所在的 .msg-wrap，不要动上层消息容器 */
	var live = document.getElementById('aiStream');
	if (live && live.parentElement && live.parentElement.parentElement) {
		var liveWrap = live.parentElement;
		try { liveWrap.parentElement.removeChild(liveWrap); } catch (e) {}
	}
	var ti = document.getElementById('aiT');
	if (ti && ti.parentElement) {
		var typeWrap = ti.parentElement;
		try { typeWrap.parentElement.removeChild(typeWrap); } catch (e) {}
	}

	var before = el.querySelectorAll('.msg-wrap').length;
	renderAIResponse(el, text, q, !!(meta && meta.source === 'error'), false);

	var wraps = el.querySelectorAll('.msg-wrap');
	if (wraps.length > before) {
		var wrap = wraps[wraps.length - 1];
		var tag = aSourceTag(meta);
		if (tag && wrap.parentNode) wrap.parentNode.insertBefore(tag, wrap.nextSibling);
	}
	el.scrollTop = el.scrollHeight;
}

/* ----------------------------------------------------------------------------
 * 14.9 对话主流程（纯逻辑编排 + 适配层渲染）
 * -------------------------------------------------------------------------- */
function aiReply(el, q, inputEl) {
	if (!el) return;
	q = String(q == null ? '' : q);
	if (!q.trim() || aiTyping) return;

	/* 次数限制：普通 5 / 会员 50 / 超级 500（月） */
	var phone = S.cu && (S.cu.phone || S.cu.uid);
	var lv = (S.cu && S.cu.level) || 0;
	var aiLimit = lv >= 2 ? 500 : (lv >= 1 ? 50 : 5);
	if (phone) {
		var used = (S.cu.usage && S.cu.usage.ai) || 0;
		if (used >= aiLimit) { tst('AI 使用次数已用完，请开通会员', 'warn'); return; }
	}

	aiTyping = true;
	aiLastMsgSender = 'user';
	aiMsgIdCounter++;
	var wasAtBottom = (el.scrollHeight - el.scrollTop - el.clientHeight) <= 60;

	/* 用户气泡 */
	var uIdx = aiMsgIdCounter;
	var uw = document.createElement('div');
	uw.className = 'msg-wrap';
	uw.style.justifyContent = 'flex-end';
	var ud = document.createElement('div');
	ud.className = 'msg msg-right';
	ud.textContent = q;
	uw.appendChild(ud);
	el.appendChild(uw);
	if (inputEl) inputEl.value = '';
	renderActions(uw, false, q, uIdx);
	if (wasAtBottom) el.scrollTop = el.scrollHeight;
	saveAIMsgs(el);

	/* 阶段化等待气泡：让等待有进度感，而不是干等秒数 */
	var tw = document.createElement('div');
	tw.className = 'msg-wrap';
	var ta = document.createElement('div');
	ta.className = 'msg-av msg-av-xiaozhi';
	ta.innerHTML = '<img src="项目应用图片/AI图标.png" />';
	tw.appendChild(ta);
	var tt = document.createElement('div');
	tt.className = 'msg-bubble msg-bubble-typing';
	tt.id = 'aiT';
	tt.textContent = '正在检索工艺知识库…';
	tw.appendChild(tt);
	el.appendChild(tw);
	if (wasAtBottom) el.scrollTop = el.scrollHeight;

	var t0 = Date.now();
	var secTimer = setInterval(function () {
		var tEl = document.getElementById('aiT');
		if (!tEl) return;
		var sec = Math.floor((Date.now() - t0) / 1000);
		if (sec < 3) tEl.textContent = '正在检索工艺知识库…';
		else if (sec < 7) tEl.textContent = '正在组织报价建议…（' + sec + 's）';
		else tEl.textContent = '还在算，别急…（' + sec + 's）';
	}, 700);

	function endTyping() {
		clearInterval(secTimer);
		var ti = document.getElementById('aiT');
		if (ti && ti.parentElement) { try { ti.parentElement.remove(); } catch (e) {} }
	}

	function deliver(text, meta) {
		endTyping();
		try {
			if (S.tab !== 'ai') {
				/* 用户已切走：存为待展示，回到 AI 页自动补上 */
				lsSetJSON(keyAIPending(), { reply: text, q: q, isError: !!(meta && meta.source === 'error'), hits: (meta && meta.hits) || [] });
				showAINotif((meta && meta.source === 'error') ? '小智暂时无法回答~' : '小智已完成回答~', !!(meta && meta.source === 'error'));
				aiTyping = false;
				return;
			}
			aShowReply(el, text, q, meta);
		} catch (e) {
			console.warn('[aiReply.deliver]', e);
		}
		aiTyping = false;
	}

	/* ① 本地即时回答：0 延迟，不消耗模型额度 */
	var local = null;
	try { local = aLocalAnswer(q); } catch (e) { local = null; }
	if (local) {
		setTimeout(function () { deliver(local, { source: 'local', hits: [], ms: 0 }); }, 80);
		return;
	}

	/* ② 缓存命中 */
	var ck = aCacheKey(q);
	var hit = aCacheGet(ck);
	if (hit) {
		deliver(hit.a, { source: 'cache', hits: hit.h, ms: 0 });
		return;
	}

	/* ③ 检索增强：Top-3 知识库条目注入提示词 */
	var hits = [];
	try { hits = aRetrieve(q, 3); } catch (e) { hits = []; }
	var deepInst = _aiDeepMode ? '\n\n本次开启深度分析：可适当展开分步推理，但仍先给结论，不用客套话。' : '';
	var systemMsg = AI_SYSTEM_PROMPT + aRagBlock(hits) + deepInst;

	/* ④ 上下文与历史瘦身（原实现 30 条订单全量 + 最多 20 条历史） */
	var ctx = aSlimContext(q);
	var hist = aiHistory.filter(function (m) { return m.role === 'user' || m.role === 'assistant'; }).slice(-8);
	var maxOut = lv >= 2 ? 900 : (lv >= 1 ? 700 : 600);

	aChat({
		message: q,
		history: hist,
		system: systemMsg,
		ctxData: ctx,
		maxOutput: maxOut,
		temperature: 0.6
	},
	function (partial) { aStreamTick(el, partial); },
	function (full, streamed) {
		deliver(full, { source: streamed ? 'stream' : 'llm', hits: hits, ms: Date.now() - t0 });
		if (phone) { try { consumeUsage(phone, 'ai'); } catch (e) {} }
		aCachePut(ck, full, hits);
	},
	function (err) {
		deliver('这条没答上来：' + err + '\n可以重发一次；如果连续失败，先检查网络或云函数是否正常。', { source: 'error', hits: hits, ms: Date.now() - t0 });
	});
}

/* 待展示回复：带上依据标签重新出气泡 */
function flushPendingReply() {
	if (!aiPendingReply) {
		try {
			var saved = lsGetJSON(keyAIPending(), null);
			if (saved) { lsDel(keyAIPending()); aiPendingReply = saved; }
		} catch (e) {}
	}
	if (!aiPendingReply) return;
	var el = document.getElementById('aiFullMsgs');
	if (!el) { aiPendingReply = null; return; }
	var p = aiPendingReply;
	aiPendingReply = null;
	aShowReply(el, p.reply, p.q, { source: p.isError ? 'error' : 'llm', hits: p.hits || [] });
}

/* 流式气泡不写入会话存档（避免切页后存下半截答案） */
function saveAIMsgs(el) {
	if (!el) el = document.getElementById('aiFullMsgs');
	if (!el) return;
	var items = el.querySelectorAll('.msg-wrap');
	var saved = '';
	var lastSender = '';
	items.forEach(function (it) {
		if (it.querySelector('#aiT')) return;
		if (it.querySelector('#aiStream')) return;
		var isAI = it.querySelector('.msg-av-xiaozhi');
		var sender = isAI ? 'ai' : 'user';
		var clone = it.cloneNode(true);
		var acts = clone.querySelector('.ai-actions'); if (acts) acts.remove();
		var sugs = clone.querySelector('.ai-suggest'); if (sugs) sugs.remove();
		if (sender === 'ai' && lastSender === 'ai') { var av = clone.querySelector('.msg-av'); if (av) av.remove(); }
		saved += clone.outerHTML;
		lastSender = sender;
	});
	try { lsSet(keyAIMsgs(), saved); } catch (e) {}
}

/* ----------------------------------------------------------------------------
 * 14.10 [纯逻辑] 自然语言 → 报价参数（结构化抽取）
 * -------------------------------------------------------------------------- */
function aMatNames() {
	var out = [];
	(MATS || []).forEach(function (g) { (g.i || []).forEach(function (it) { out.push(it.n); }); });
	return out;
}
function aProcNames() {
	var out = [];
	(PROCS || []).forEach(function (g) { (g.i || []).forEach(function (p) { out.push(p.n); }); });
	return out;
}

/* 材料模糊匹配：名称 / 去括号名 / 字母数字代号 三级 */
function aFindMat(name) {
	if (!name) return null;
	name = String(name);
	var best = null, bestLen = 0;
	(MATS || []).forEach(function (g) {
		(g.i || []).forEach(function (it) {
			var cands = [it.n, it.n.replace(/[（(].*?[)）]/g, '').trim()];
			var codes = it.n.match(/[A-Za-z0-9#.]+/g) || [];
			codes.forEach(function (c) { if (c.length >= 2) cands.push(c); });
			cands.forEach(function (c) {
				if (!c || c.length < 2) return;
				var hit = name === c || name.toUpperCase().indexOf(c.toUpperCase()) >= 0 ||
					c.toUpperCase().indexOf(name.toUpperCase()) >= 0;
				if (hit && c.length > bestLen) { best = { it: it, group: g.n }; bestLen = c.length; }
			});
		});
	});
	return best;
}

/* 工艺模糊匹配 */
function aFindProc(name) {
	if (!name) return null;
	name = String(name);
	var best = null, bestLen = 0;
	(PROCS || []).forEach(function (g) {
		(g.i || []).forEach(function (p) {
			var cands = [p.n, p.n.replace(/[\s（(].*$/g, '')];
			cands.forEach(function (c) {
				if (!c || c.length < 2) return;
				if ((name.indexOf(c) >= 0 || c.indexOf(name) >= 0) && c.length > bestLen) {
					best = { n: p.n, p: p.p, group: g.n }; bestLen = c.length;
				}
			});
		});
	});
	return best;
}

/* 口语别名 → 工艺库标准名（只收无歧义的高频说法，其余交给模型路径） */
var A_PROC_ALIAS = {
	'数控车': '排刀式数控车',
	'车床': '普通车床',
	'普车': '普通车床',
	'CNC': '三轴 (≤300mm)',
	'cnc': '三轴 (≤300mm)',
	'加工中心': '三轴 (≤300mm)',
	'线割': '线切割'
};

/* 沿标签取第一个数字 */
function aNumByLabel(t, labels) {	for (var i = 0; i < labels.length; i++) {
		var rx = new RegExp('(?:' + labels[i] + ')\\s*[:：]?\\s*(\\d+(?:\\.\\d+)?)', 'i');
		var m = t.match(rx);
		if (m) return parseFloat(m[1]);
	}
	return null;
}

/* 本地规则解析：无网络、毫秒级，作为模型解析的兜底与快速通道 */
function aLocalParse(txt) {
	var t = String(txt || '');
	var o = { material: null, shape: null, dims: {}, processes: [], quantity: null, price: null };

	var mm = aFindMat(t);
	if (mm) o.material = mm.it.n;

	/* 形状判定：取最先出现的关键词，且不用裸"轴/管/盘"单字，
	   否则"三轴加工中心"里的"轴"会把板件误判成回转体 */
	var cylKw = ['圆柱', '圆棒', '圆钢', '棒料', '圆件', '圆盘', '圆筒', '圆环', '轴类', '车轴', '套筒', '管材', '管件'];
	var sqKw = ['方形', '方料', '方件', '方钢', '板件', '板材', '矩形', '长条', '扁', '块', '板'];
	var cylHit = -1, sqHit = -1, ki, ci, si;
	for (ki = 0; ki < cylKw.length; ki++) { ci = t.indexOf(cylKw[ki]); if (ci >= 0 && (cylHit < 0 || ci < cylHit)) cylHit = ci; }
	for (ki = 0; ki < sqKw.length; ki++) { si = t.indexOf(sqKw[ki]); if (si >= 0 && (sqHit < 0 || si < sqHit)) sqHit = si; }
	if (cylHit >= 0 && sqHit >= 0) o.shape = (cylHit <= sqHit) ? 'cylinder' : 'square';
	else if (cylHit >= 0) o.shape = 'cylinder';
	else if (sqHit >= 0) o.shape = 'square';

	/* 只认中文标签与 Ø/Φ：单字母标签（L/W/H/D）会误吃 H13、AL6061 这类材料代号 */
	var dia = aNumByLabel(t, ['Ø', 'ø', 'Φ', 'φ', '直径', '外径']);
	var len = aNumByLabel(t, ['长度', '长']);
	var wid = aNumByLabel(t, ['宽度', '宽']);
	var hei = aNumByLabel(t, ['高度', '高']);

	/* Ø40×120 这类写法：取直径后的第二段数字作为长度/高 */
	if (dia !== null && len === null) {
		var rx2 = new RegExp(dia + '\\s*(?:mm)?\\s*[×xX*]\\s*(\\d+(?:\\.\\d+)?)');
		var m2 = t.match(rx2);
		if (m2) len = parseFloat(m2[1]);
	}
	if (o.shape === 'cylinder') {
		if (dia !== null) o.dims.d = dia;
		if (len !== null) o.dims.h2 = len;
		else if (hei !== null) o.dims.h2 = hei;
	} else if (o.shape === 'square') {
		if (len !== null) o.dims.l = len;
		if (wid !== null) o.dims.w = wid;
		if (hei !== null) o.dims.h = hei;
	} else {
		if (dia !== null) { o.shape = 'cylinder'; o.dims.d = dia; if (len !== null) o.dims.h2 = len; }
		else if (len !== null && wid !== null) { o.shape = 'square'; o.dims.l = len; o.dims.w = wid; if (hei !== null) o.dims.h = hei; }
	}

	/* 工序识别：tier0 整名命中 → tier1 去括号核心名 → tier2 人工维护的口语别名。
	   不做通用前后缀生成（会把"三轴加工中心"额外匹配出"卧式加工中心"、"外圆磨"匹配出"内圆磨"），
	   口语说法交给别名表或模型路径处理。*/
	var cand = [];
	(PROCS || []).forEach(function (g) {
		(g.i || []).forEach(function (p) {
			var full = p.n;
			var core = p.n.replace(/[\s（(].*$/g, '');
			if (full && t.indexOf(full) >= 0) { cand.push({ p: p, key: full, tier: 0, idx: t.indexOf(full) }); return; }
			if (core && core !== full && t.indexOf(core) >= 0) { cand.push({ p: p, key: core, tier: 1, idx: t.indexOf(core) }); return; }
			for (var al in A_PROC_ALIAS) {
				if (!Object.prototype.hasOwnProperty.call(A_PROC_ALIAS, al)) continue;
				if (A_PROC_ALIAS[al] !== full) continue;
				if (t.indexOf(al) >= 0) { cand.push({ p: p, key: al, tier: 2, idx: t.indexOf(al) }); break; }
			}
		});
	});

	/* 精确匹配优先占位；同 key / 同工序 / 同区间只保留一个 */
	cand.sort(function (a, b) { return a.tier - b.tier || b.key.length - a.key.length || a.idx - b.idx; });
	var spans = [], picked = [], seenKey = {}, seenProc = {};
	cand.forEach(function (c) {
		if (seenKey[c.key] || seenProc[c.p.n]) return;
		var end = c.idx + c.key.length;
		var clash = false;
		for (var i2 = 0; i2 < spans.length; i2++) {
			if (!(end <= spans[i2].start || c.idx >= spans[i2].end)) { clash = true; break; }
		}
		if (clash) return;
		spans.push({ start: c.idx, end: end });
		picked.push(c);
		seenKey[c.key] = 1;
		seenProc[c.p.n] = 1;
	});
	picked.sort(function (a, b) { return a.idx - b.idx; });

	picked.forEach(function (f) {
		var seg = t.slice(f.idx + f.key.length, f.idx + f.key.length + 20);
		var hm = seg.match(/(\d+(?:\.\d+)?)\s*(秒|分|分钟|h|H|小时|时)/);
		var h = 1, u = '时';
		if (hm) {
			h = parseFloat(hm[1]);
			u = /秒/.test(hm[2]) ? '秒' : (/分/.test(hm[2]) ? '分' : '时');
		}
		o.processes.push({ name: f.p.n, price: f.p.p, hours: h, unit: u });
	});

	var qm = t.match(/(?:数量|共|一共|做)\s*[:：]?\s*(\d+)/) || t.match(/(\d+)\s*(?:件|个|只|pcs)/i);
	if (qm) o.quantity = parseInt(qm[1]);

	var pm = t.match(/(\d+(?:\.\d+)?)\s*元\s*\/?\s*(?:kg|公斤|千克)/i);
	if (pm) o.price = parseFloat(pm[1]);

	return o;
}

function aHasParams(o) {
	if (!o) return false;
	var d = o.dims || {};
	return !!(o.material || d.d != null || d.l != null || d.h2 != null || (o.processes && o.processes.length));
}

/* 模型解析：要求只输出 JSON；失败则回退本地规则 */
function aModelExtract(txt) {
	return new Promise(function (resolve) {
		var sys = [
			'你是机加工报价参数抽取器。把用户的一句话描述转成 JSON，只输出 JSON，不要解释、不要代码块围栏。',
			'字段定义：',
			'material: 材料库中的名称，原样返回，找不到填 null',
			'shape: "cylinder"（轴/圆棒/套等回转体）或 "square"（板/块/方形件）',
			'dims: {"d":直径mm,"h2":高mm,"l":长mm,"w":宽mm,"h":高mm}，未提到的不要给',
			'quantity: 整数，未提到填 null',
			'processes: [{"name":工艺库名称,"hours":数字,"unit":"时"/"分"/"秒"}]',
			'price: 材料单价 元/kg，未提到填 null',
			'',
			'材料库：' + aMatNames().join('、'),
			'工艺库：' + aProcNames().join('、'),
			'',
			'示例输入：45#钢圆棒直径40长120，数控车0.5h，再外圆磨0.4h，数量3',
			'示例输出：{"material":"45#钢","shape":"cylinder","dims":{"d":40,"h2":120},"quantity":3,"processes":[{"name":"排刀式数控车","hours":0.5,"unit":"时"},{"name":"外圆磨","hours":0.4,"unit":"时"}],"price":null}'
		].join('\n');

		var ab = (typeof AbortController !== 'undefined') ? new AbortController() : null;
		var to = setTimeout(function () { if (ab) { try { ab.abort(); } catch (e) {} } }, 20000);
		var opts = {
			method: 'POST',
			headers: { 'Content-Type': 'application/json' },
			body: JSON.stringify({
				message: txt,
				system: sys,
				ctxData: { task: 'extract_params' },
				maxOutput: 400,
				temperature: 0.1,
				responseFormat: 'json_object'
			})
		};
		if (ab) opts.signal = ab.signal;

		fetch(AI_WORKER_URL, opts).then(function (r) { return r.text(); }).then(function (raw) {
			clearTimeout(to);
			var d = null;
			try { d = JSON.parse(raw); } catch (e) { resolve(null); return; }
			var c = d && d.choices && d.choices[0] && d.choices[0].message && d.choices[0].message.content;
			if (!c) { resolve(null); return; }
			var obj = null;
			try { obj = JSON.parse(c); } catch (e) {
				var m = String(c).match(/\{[\s\S]*\}/);
				if (m) { try { obj = JSON.parse(m[0]); } catch (e2) { obj = null; } }
			}
			resolve(obj);
		}).catch(function () { clearTimeout(to); resolve(null); });
	});
}

/* 先走本地规则（快），本地凑不齐再问模型（准），模型失败仍回退本地 */
function aFillExtract(txt) {
	var local = aLocalParse(txt);
	var hasProcWord = /(车|铣|磨|钻|割|火花|氧化|镀|淬|回火|氮化|折弯|冲压|焊|攻牙|加工中心)/.test(txt);
	var localOk = local && local.material && (local.dims.d != null || local.dims.l != null) &&
		((local.processes && local.processes.length) || !hasProcWord);
	if (localOk) return Promise.resolve(local);
	return aModelExtract(txt).then(function (obj) {
		if (!obj || !aHasParams(obj)) return local || {};
		return aMergeParams(obj, local);          /* 模型结果优先，本地结果补齐缺失字段 */
	}).catch(function () { return local || {}; });
}

/* 合并模型与本地解析结果 */
function aMergeParams(model, local) {
	var ms = (model && model.dims) || {};
	var ls = (local && local.dims) || {};
	var out = { material: null, shape: null, dims: {}, quantity: null, price: null, processes: [] };
	out.material = model.material || (local && local.material) || null;
	out.shape = model.shape || (local && local.shape) || null;
	['d', 'h2', 'l', 'w', 'h'].forEach(function (k) {
		if (ms[k] != null) out.dims[k] = ms[k];
		else if (ls[k] != null) out.dims[k] = ls[k];
	});
	out.quantity = (model.quantity != null) ? model.quantity : ((local && local.quantity != null) ? local.quantity : null);
	out.price = (model.price != null) ? model.price : ((local && local.price != null) ? local.price : null);
	out.processes = (model.processes && model.processes.length) ? model.processes : ((local && local.processes) || []);
	return out;
}

/* 14.11 [适配层] 参数写入与表单回填：所有字段写入前做合法性校验，非法值一律不写 */
function aApplyParams(o) {
	var applied = [];
	try {
		if (o.material) {
			var m = aFindMat(o.material);
			if (m) {
				S.mt = { n: m.it.n, de: m.it.de, pr: 0 };
				var keep = (S.mPrices && S.mPrices[m.it.n]) || o.price || S.mp || '';
				S.mp = keep;
				applied.push('材料 ' + m.it.n);
			}
		}
		if (o.shape === 'cylinder' || o.shape === 'square') {
			S.shp = o.shape;
			applied.push(o.shape === 'cylinder' ? '圆柱形' : '方形');
		}
		var d = o.dims || {};
		if (isFinite(d.d) && d.d > 0) S.d = d.d;
		if (isFinite(d.h2) && d.h2 > 0) S.h2 = d.h2;
		if (isFinite(d.l) && d.l > 0) S.l = d.l;
		if (isFinite(d.w) && d.w > 0) S.w = d.w;
		if (isFinite(d.h) && d.h > 0) S.h = d.h;
		if (o.quantity != null) {
			var qn = parseInt(o.quantity, 10);
			if (qn > 0) { S.q = qn; applied.push('数量 ' + qn); }
		}
		if (o.processes && o.processes.length) {
			var rows = [];
			for (var i = 0; i < o.processes.length && rows.length < 8; i++) {
				var p = o.processes[i] || {};
				var hit = aFindProc(p.name);
				if (!hit) continue;
				var hh = parseFloat(p.hours);
				if (!isFinite(hh) || hh <= 0) hh = 1;
				var uu = (p.unit === '分' || p.unit === '秒') ? p.unit : '时';
				rows.push({ n: hit.n, h: hh, u: uu, p: hit.p });
			}
			if (rows.length) { S.pr = rows; applied.push('工序 ' + rows.length + ' 道'); }
		}
	} catch (e) {
		tst('填入失败：' + ((e && e.message) || e), 'warn');
		return;
	}
	if (!applied.length) { tst('没识别出可用参数，换个说法再试', 'warn'); return; }
	S.tab = 'calc';
	rA();
	setTimeout(function () { try { upQ(); } catch (e) {} }, 80);
	var tip = '已填入：' + applied.join('，') + '（可再手动改）';
	/* 材料单价因厂而异，识别不出来必须提醒补填，否则材料费算成 0 */
	if (S.mt && !nf(S.mp)) tip += '｜材料单价没识别到，记得补填，不然材料费是 0';
	showAIToast(tip);
}

 * 目标：同一份代码，既能在电脑/手机浏览器直接打开，也能作为微信小程序
 *      web-view 的承载页运行，且【业务代码零改动】。
 * 手段：启动时做一次能力探测，对四处环境差异打运行时补丁：
 *   15.1 环境探测        —— 判断当前是否在微信 / 小程序 web-view 内
 *   15.2 剪贴板补丁      —— navigator.clipboard 缺失时补 execCommand 实现
 *   15.3 下载补丁        —— web-view 内 <a download> 无效时改为复制/提示
 *   15.4 小程序桥        —— 关键事件通过 JSSDK postMessage 抛给宿主页面
 *   15.5 外部组件兜底    —— html2canvas 等 CDN 组件未加载时给提示而非白屏

/* 15.2 剪贴板补丁：全部 7 处调用点无需改动，行为在运行时被补齐 */
(function patchClipboard() {
	try {
		var nav = window.navigator;
		if (!nav) return;
		var nativeWrite = (nav.clipboard && typeof nav.clipboard.writeText === 'function')
			? nav.clipboard.writeText.bind(nav.clipboard) : null;

		function legacyCopy(text) {
			try {
				var ta = document.createElement('textarea');
				ta.value = String(text == null ? '' : text);
				ta.setAttribute('readonly', '');
				ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0';
				document.body.appendChild(ta);
				ta.select();
				try { ta.setSelectionRange(0, ta.value.length); } catch (e) {}
				var ok = document.execCommand('copy');
				document.body.removeChild(ta);
				return ok;
			} catch (e) { return false; }
		}

		var api = {
			writeText: function (text) {
				return new Promise(function (resolve, reject) {
					function fallback() { legacyCopy(text) ? resolve() : reject(new Error('copy-failed')); }
					if (nativeWrite) {
						try { nativeWrite(String(text)).then(function () { resolve(); }).catch(fallback); return; } catch (e) {}
					}
					fallback();
				});
			}
		};
		try {
			Object.defineProperty(nav, 'clipboard', { value: api, configurable: true, writable: true });
		} catch (e) {
			try { if (nav.clipboard) nav.clipboard.writeText = api.writeText; } catch (e2) {}
		}
	} catch (e) {}
})();

/* 15.3 下载补丁：只在 web-view 内拦截，普通浏览器行为完全不变 */
(function patchDownload() {
	if (!ENV.inMiniProgram) return;
	try {
		var origClick = HTMLAnchorElement.prototype.click;
		HTMLAnchorElement.prototype.click = function () {
			try {
				var dl = this.getAttribute && this.getAttribute('download');
				if (dl && /^blob:/i.test(this.href)) {
					var name = dl;
					var href = this.href;
					fetch(href).then(function (r) { return r.blob(); }).then(function (b) {
						var type = (b && b.type) || '';
						if (/pdf/i.test(type)) { tst('小程序内不能直接下载 PDF，可改存图片或长按保存', 'warn'); return; }
						if (/image/i.test(type)) { tst('小程序内请长按图片保存到相册', 'warn'); return; }
						return b.text().then(function (txt) {
							navigator.clipboard.writeText(txt).then(function () {
								tst('已复制「' + name + '」内容，可在电脑端粘贴成文件', 'ok');
							}).catch(function () { tst('当前环境不支持导出文件', 'warn'); });
						});
					}).catch(function () { tst('当前环境不支持导出文件', 'warn'); });
					return;
				}
			} catch (e) {}
			return origClick.apply(this, arguments);
		};
	} catch (e) {}
})();

}

/* 15.7 图片路径容错
   三张图（图标（白）/ logo（白）/ AI图标）可能被放在不同位置：
   html 与 项目应用图片/ 同级、html 在桌面而图片在 各项大赛/数智工价/项目应用图片/、
   或图片与 html 平铺在一起。这里按优先级依次尝试，加载失败自动换下一个候选目录。 */
(function patchImgPath() {
	if (typeof document === 'undefined') return;
	var DIRS = ['项目应用图片/', '各项大赛/数智工价/项目应用图片/', ''];
	function nextSrc(src) {
		var s = String(src || '');
		if (!s || /^(data:|https?:|blob:|\/)/i.test(s)) return null;   /* 外链/绝对路径不处理 */
		var cut = s.lastIndexOf('/');
		var dir = cut >= 0 ? s.slice(0, cut + 1) : '';
		var base = cut >= 0 ? s.slice(cut + 1) : s;
		var at = DIRS.indexOf(dir);
		for (var i = at + 1; i < DIRS.length; i++) {
			if (DIRS[i] === dir) continue;
			return DIRS[i] + base;
		}
		return null;
	}
	document.addEventListener('error', function (e) {
		var t = e.target;
		if (!t || t.tagName !== 'IMG') return;
		var n = parseInt(t.getAttribute('data-imgtry') || '0', 10);
		if (n >= DIRS.length) return;
		var nxt = nextSrc(t.getAttribute('src'));
		if (!nxt) return;
		t.setAttribute('data-imgtry', String(n + 1));
		t.src = nxt;
	}, true);
})();
